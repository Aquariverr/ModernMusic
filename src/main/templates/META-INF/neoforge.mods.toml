modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
logoBlur=true
authors="Aquariverr"
description='''
在 Minecraft 中播放网易云音乐、QQ 音乐和酷狗音乐。
支持歌曲搜索、歌单导入、歌词显示和多人同步收听。
进入世界后按 Ctrl+M 打开播放器。
'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="ftbteams"
type="optional"
versionRange="[2101.1.11,2102)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
