import groovy.json.JsonOutput
import java.security.MessageDigest
import java.time.Instant
import java.util.zip.ZipFile
import net.neoforged.moddevgradle.dsl.ModModel
import net.neoforged.moddevgradle.dsl.RunModel

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

def gradleProviders = providers
String musicModId = gradleProviders.gradleProperty('mod_id').get()

version = mod_version
group = mod_group_id
base.archivesName = mod_id
// Keep automated paired clients separate from IDE-generated run arguments and classpaths.
def auditBaseline = gradleProviders.gradleProperty('auditBaseline').getOrElse('false').toBoolean()
if (auditBaseline) {
    layout.buildDirectory = layout.projectDirectory.dir('build/performance-before-runtime')
} else if (gradleProviders.gradleProperty('isolatedSmokeBuild').getOrElse('false').toBoolean()) {
    layout.buildDirectory = layout.projectDirectory.dir('build/paired-smoke')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases'; content { includeGroup 'dev.ftb.mods' } }
    maven { url = 'https://maven.architectury.dev'; content { includeGroup 'dev.architectury' } }
}

sourceSets {
    clientSmoke
    optionalServerSmoke
    performanceAudit
}
def mainSources = sourceSets.named('main')
def testSources = sourceSets.named('test')
def clientSmokeSources = sourceSets.named('clientSmoke')
def optionalServerSmokeSources = sourceSets.named('optionalServerSmoke')
def performanceAuditSources = sourceSets.named('performanceAudit')
// An opt-in before/after audit compiles the preserved production Java snapshot.
// Keep separate class/output directories so editing and compiling current code is safe.
if (auditBaseline) {
    def baselineSources = layout.projectDirectory.dir('build/performance-before/main/java').asFile
    if (!baselineSources.isDirectory()) throw new GradleException('Missing preserved audit baseline sources')
    mainSources.configure { SourceSet sources -> sources.java.setSrcDirs([baselineSources]) }
}
configurations.clientSmokeImplementation.extendsFrom(configurations.implementation)
configurations.clientSmokeRuntimeOnly.extendsFrom(configurations.runtimeOnly)
configurations.performanceAuditImplementation.extendsFrom(configurations.implementation)
configurations.performanceAuditRuntimeOnly.extendsFrom(configurations.runtimeOnly)

dependencies {
    // Compile against the real public API, but do not bundle or require these mods.
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    clientSmokeCompileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    clientSmokeCompileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    if (gradleProviders.gradleProperty('ftbTeams').getOrElse('false').toBoolean()) {
        runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
        runtimeOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
        runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
    }
    implementation 'javazoom:jlayer:1.0.1'
    jarJar 'javazoom:jlayer:1.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    jarJar 'com.google.zxing:core:3.5.3'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'net.java.dev.jna:jna-platform:5.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    clientSmokeImplementation files(mainSources.map { it.output })
    performanceAuditImplementation files(mainSources.map { it.output })
}

tasks.named('test', Test).configure { Test testTask ->
    testTask.useJUnitPlatform()
    testTask.systemProperty 'junit.jupiter.execution.timeout.default', '10 s'
}

