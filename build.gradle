            run.systemProperty 'modernmusic.optionalClientSmoke', 'true'
            run.programArguments.addAll('--username', 'OptionalClient')
        }
    }

}

tasks.withType(JavaExec).matching { it.name.startsWith('runAudit') }.configureEach {
    jvmArgs '-Xms512m', '-Xmx2g'
    systemProperty 'modernmusic.auditRenderCounters', 'true'
    systemProperty 'modernmusic.auditBaseline', auditBaseline.toString()
}

def auditManifestSources = files(mainSources.map { it.allSource }, performanceAuditSources.map { it.allSource })
def auditManifestDestination = layout.buildDirectory.file('audit-source-manifest.json')
def auditManifestProjectRoot = layout.projectDirectory.asFile
tasks.register('writeAuditSourceManifest') {
    dependsOn 'performanceAuditClasses'
    inputs.files(auditManifestSources)
    outputs.file(auditManifestDestination)
    doLast {
        def files = auditManifestSources.files.findAll { it.isFile() }.sort { it.path }
        def manifest = [baseline: auditBaseline, compiledAt: Instant.now().toString(), files: files.collect { file ->
            [path: auditManifestProjectRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/'), sha256: MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()]
        }]
        def destination = auditManifestDestination.get().asFile
        destination.parentFile.mkdirs()
        destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest))
    }
}

