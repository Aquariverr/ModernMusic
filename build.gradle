    group = 'verification'
    description = 'Probe public guest metadata, resource resolution and MP3 decoding (no audio output).'
    classpath = testSources.get().runtimeClasspath
    mainClass = 'dev.modernmusic.probe.GuestProbe'
}

tasks.register('probeQq', JavaExec) {
    group = 'verification'
    description = 'Probe QQ Music public endpoints without reading account credentials.'
    classpath = testSources.get().runtimeClasspath
    mainClass = 'dev.modernmusic.probe.QqProbe'
}
tasks.register('probeKugou', JavaExec) {
    group = 'verification'
    description = 'Probe Kugou public search, playlists, lyrics and free MP3 playback; no saved credentials.'
    dependsOn testClasses
    classpath = testSources.get().runtimeClasspath
    mainClass = 'dev.modernmusic.probe.KugouProbe'
}

