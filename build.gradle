// Release artifacts are an allowlisted bundle; runtime accounts, worlds and smoke code never enter it.
def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def releaseSources = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def releaseChecksums = layout.buildDirectory.file('release/SHA256SUMS.txt')
tasks.register('verifyReleaseJar') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(releaseJar)
    doLast {
        new ZipFile(releaseJar.get().asFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            (['META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json', 'icon.png',
             'META-INF/LICENSE', 'META-INF/THIRD_PARTY_NOTICES.md', 'META-INF/licenses/JLayer-LGPL-2.1.txt',
             'META-INF/licenses/ZXing-LICENSE.txt', 'META-INF/licenses/NetMusic-BetterLogin-MIT.txt',
             'META-INF/library-sources/jlayer-1.0.1-sources.jar',
             'assets/modernmusic/lang/zh_cn.json', 'assets/modernmusic/lang/en_us.json',
             'assets/modernmusic/font/ui_sans.ttf', 'META-INF/licenses/NotoSansSC-OFL.txt',
             'META-INF/accesstransformer.cfg'] + ['create', 'ae2', 'ars_nouveau', 'astral_sorcery'].collectMany { skin ->
                ['panel.png', 'panel.png.mcmeta'].collect { "assets/modernmusic/textures/gui/sprites/theme/${skin}/${it}".toString() }
             }).each { required ->
                if (!names.contains(required)) throw new GradleException("Release JAR missing ${required}")
            }
            if (names.any { it.contains('/smoke/') || it.contains('/audit/') || it.startsWith('modernmusic-private/') || it.startsWith('runs/') })
                throw new GradleException('Release JAR contains development or private files')
            names.findAll { it.endsWith('.class') }.each { name ->
                def bytes = zip.getInputStream(zip.getEntry(name)).withCloseable { it.readNBytes(8) }
                if (bytes.length != 8 || ((bytes[6] & 255) << 8 | (bytes[7] & 255)) != 65)
                    throw new GradleException("Expected Java 21 bytecode: ${name}")
            }
        }
    }
}
tasks.named('check').configure { dependsOn 'verifyReleaseJar' }
tasks.register('releaseChecksums') {
    dependsOn 'verifyReleaseJar', 'sourcesJar'
    inputs.files(releaseJar, releaseSources)
    outputs.file(releaseChecksums)
    doLast {
        def target = releaseChecksums.get().asFile
        target.parentFile.mkdirs()
        target.text = [releaseJar.get().asFile, releaseSources.get().asFile].collect { artifact ->
            def hash = MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            "${hash}  ${artifact.name}\n"
        }.join('')
    }
}
tasks.register('releaseBundle', Zip) {
    group = 'distribution'
    description = 'Build and verify the release JAR, sources, checksums and user documentation.'
    dependsOn 'build', 'releaseChecksums'
    archiveFileName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(releaseJar)
    from(releaseSources)
    from(releaseChecksums)
    from('README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('docs') { into 'docs' }
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '9.2.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f'
}

