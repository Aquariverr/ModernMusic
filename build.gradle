import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    optionalServerSmoke {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file("runs/${name}")
            jvmArgs '-Xms256m', '-Xmx2G'
            property 'forge.logging.console.level', 'info'
            if (providers.gradleProperty('ftbTeams').getOrElse('false').toBoolean()) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            }
            mods { modernmusic { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        clientSmoke {
            parent runs.client
            property 'modernmusic.smokeHidden', providers.gradleProperty('smokeHidden').getOrElse('true')
            mods { modernmusic_smoke { source sourceSets.clientSmoke } }
        }
        uiGallery {
            parent runs.clientSmoke
            property 'modernmusic.uiGallery', 'true'
        }
        fontSmoke {
            parent runs.clientSmoke
            property 'modernmusic.fontSmoke', 'true'
        }
        searchSmoke {
            parent runs.clientSmoke
            property 'modernmusic.searchSmoke', 'true'
        }
        lifecycleSmoke {
            parent runs.clientSmoke
            property 'modernmusic.lifecycleSmoke', 'true'
        }
        // ForgeGradle merges runs in name order: server parents must be processed first.
        serverRoomSmoke {
            taskName 'runRoomServerSmoke'
            parent runs.server
            mods { modernmusic_smoke { source sourceSets.clientSmoke } }
        }
        roomHostSmoke {
            parent runs.clientSmoke
            property 'modernmusic.roomSmoke', 'host'
            property 'modernmusic.publicRoomSmoke', providers.gradleProperty('publicRoomSmoke').getOrElse('false')
            property 'modernmusic.audioSmoke', providers.gradleProperty('audioSmoke').getOrElse('false')
            property 'modernmusic.sharedSmoke', providers.gradleProperty('sharedSmoke').getOrElse('false')
            property 'modernmusic.ftbSmoke', providers.gradleProperty('ftbSmoke').getOrElse('false')
            args '--username', 'RoomHost'
        }
        roomGuestSmoke {
            parent runs.clientSmoke
            property 'modernmusic.roomSmoke', 'guest'
            property 'modernmusic.publicRoomSmoke', providers.gradleProperty('publicRoomSmoke').getOrElse('false')
            property 'modernmusic.audioSmoke', providers.gradleProperty('audioSmoke').getOrElse('false')
            property 'modernmusic.sharedSmoke', providers.gradleProperty('sharedSmoke').getOrElse('false')
            property 'modernmusic.ftbSmoke', providers.gradleProperty('ftbSmoke').getOrElse('false')
            args '--username', 'RoomGuest'
        }
        serverOptionalSmoke {
            taskName 'runOptionalServerSmoke'
            parent runs.server
            mods.remove(mods.getByName('modernmusic'))
            mods { modernmusic_optional_smoke { source sourceSets.optionalServerSmoke } }
            environment 'MOD_CLASSES', sourceSets.optionalServerSmoke.output.files.collect {
                "modernmusic_optional_smoke%%${it.absolutePath}"
            }.join(File.pathSeparator)
            property 'modernmusic.optionalServerSmoke', 'true'
        }
        optionalClientSmoke {
            parent runs.clientSmoke
            property 'modernmusic.optionalClientSmoke', 'true'
            args '--username', 'OptionalClient'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.ftb.dev/releases'; content { includeGroup 'dev.ftb.mods' } }
    maven { url = 'https://maven.architectury.dev'; content { includeGroup 'dev.architectury' } }
}

jarJar.enable()
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly(fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")) { transitive = false }
    clientSmokeCompileOnly(fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")) { transitive = false }
    if (providers.gradleProperty('ftbTeams').getOrElse('false').toBoolean()) {
        runtimeOnly(fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftb_teams_version}")) { transitive = false }
        runtimeOnly(fg.deobf("dev.ftb.mods:ftb-library-forge:${ftb_library_version}")) { transitive = false }
        runtimeOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) { transitive = false }
    }
    implementation 'javazoom:jlayer:1.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    minecraftLibrary 'javazoom:jlayer:1.0.1'
    minecraftLibrary 'com.google.zxing:core:3.5.3'
    jarJar(group: 'javazoom', name: 'jlayer', version: '[1.0.1,1.0.2)') { jarJar.pin(it, '1.0.1') }
    jarJar(group: 'com.google.zxing', name: 'core', version: '[3.5.3,3.6)') { jarJar.pin(it, '3.5.3') }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.execution.timeout.default', '10 s'
}

// Standalone runs keep smoke fixtures out of release artifacts and user worlds.
minecraft.runs.configureEach {
    def directory = [serverRoomSmoke: 'room-server-smoke', serverOptionalSmoke: 'optional-server-smoke'][name]
    workingDirectory project.file('runs/' + (directory ?: name.replaceAll(/([a-z])([A-Z])/, '$1-$2').toLowerCase()))
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version }
    from(['LICENSE', 'THIRD_PARTY_NOTICES.md']) { into 'META-INF' }
}
tasks.named('sourcesJar', Jar) {
    from(['LICENSE', 'THIRD_PARTY_NOTICES.md']) { into 'META-INF' }
}
tasks.named('jar', Jar) { archiveClassifier = 'slim'; finalizedBy 'reobfJar' }
tasks.named('jarJar', Jar) { archiveClassifier = ''; finalizedBy 'reobfJarJar' }
reobf { jarJar {} }
tasks.named('assemble') { dependsOn 'jarJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    dependsOn 'reobfJarJar'
    doLast {
        new ZipFile(tasks.jarJar.archiveFile.get().asFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            ['META-INF/mods.toml', 'META-INF/jarjar/metadata.json', 'META-INF/accesstransformer.cfg',
             'META-INF/LICENSE', 'META-INF/THIRD_PARTY_NOTICES.md', 'icon.png',
             'assets/modernmusic/lang/zh_cn.json', 'assets/modernmusic/lang/en_us.json',
             'assets/modernmusic/font/ui_sans.ttf'].each {
                if (!names.contains(it)) throw new GradleException("Missing release resource: ${it}")
            }
            if (names.any { it.contains('/smoke/') || it.contains('/audit/') || it.startsWith('modernmusic-private/') })
                throw new GradleException('Development/private content in release JAR')
            names.findAll { it.endsWith('.class') }.each {
                def bytes = zip.getInputStream(zip.getEntry(it)).withCloseable { stream -> stream.readNBytes(8) }
                if (((bytes[6] & 255) << 8 | (bytes[7] & 255)) != 61) throw new GradleException("Not Java 17: ${it}")
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyReleaseJar' }

def smokeResults = [ClientSmoke: ['client-smoke', 'smoke-result.txt'], FontSmoke: ['font-smoke', 'font-result.txt'],
                    SearchSmoke: ['search-smoke', 'search-result.txt'], UiGallery: ['ui-gallery', 'gallery-result.txt'],
                    LifecycleSmoke: ['lifecycle-smoke', 'lifecycle-result.txt'],
                    OptionalClientSmoke: ['optional-client-smoke', 'optional-result.txt'],
                    OptionalServerSmoke: ['optional-server-smoke', 'optional-result.txt'],
                    RoomHostSmoke: ['room-host-smoke', 'room-result.txt'], RoomGuestSmoke: ['room-guest-smoke', 'room-result.txt'],
                    RoomServerSmoke: ['room-server-smoke', "server-${providers.gradleProperty('ftbTeams').getOrElse('false').toBoolean() ? 'ftb' : 'no-ftb'}-result.txt"]]
smokeResults.each { name, location ->
    tasks.matching { it.name == "run${name}" }.configureEach {
        def resultFile = file("runs/${location[0]}/${location[1]}")
        doFirst { resultFile.parentFile.mkdirs(); resultFile.text = 'RUNNING\n' }
        doLast {
            if (!resultFile.isFile() || !resultFile.text.startsWith('PASS:'))
                throw new GradleException("Smoke failed; see ${resultFile}")
        }
    }
}
