NamedDomainObjectContainer<ModModel> modDefinitions = neoForge.mods
def musicMod = modDefinitions.register(musicModId) { ModModel mod ->
    mod.modSourceSets.add(mainSources)
}
def smokeMod = modDefinitions.register('modernmusic_smoke') { ModModel mod ->
    mod.modSourceSets.add(clientSmokeSources)
}
def optionalSmokeMod = modDefinitions.register('modernmusic_optional_smoke') { ModModel mod ->
    mod.modSourceSets.add(optionalServerSmokeSources)
}
def auditMod = modDefinitions.register('modernmusic_audit') { ModModel mod ->
    mod.modSourceSets.add(performanceAuditSources)
}
def mainMods = musicMod.map { mod -> [mod] }
def smokeMods = musicMod.zip(smokeMod) { mod, smoke -> [mod, smoke] }
def auditMods = musicMod.zip(auditMod) { mod, audit -> [mod, audit] }
def optionalSmokeMods = optionalSmokeMod.map { mod -> [mod] }

neoForge {
    version = project.neo_version
    addModdingDependenciesTo clientSmokeSources.get()
    addModdingDependenciesTo optionalServerSmokeSources.get()
    addModdingDependenciesTo performanceAuditSources.get()

    runs {
        auditServer { RunModel run ->
            run.server()
            run.sourceSet.set(performanceAuditSources)
            run.loadedMods.set(auditMods)
            run.gameDirectory = project.file('runs/audit-server')
            run.programArgument '--nogui'
            run.systemProperty 'modernmusic.auditRole', 'server'
            run.systemProperty 'modernmusic.auditSharedAccount', gradleProviders.gradleProperty('auditSharedAccount').getOrElse('false')
        }
        auditLeader { RunModel run ->
            run.client()
            run.sourceSet.set(performanceAuditSources)
            run.loadedMods.set(auditMods)
            run.gameDirectory = project.file('runs/audit-leader')
            run.systemProperty 'modernmusic.auditRole', 'leader'
            run.systemProperty 'modernmusic.auditSharedAccount', gradleProviders.gradleProperty('auditSharedAccount').getOrElse('false')
            run.programArguments.addAll('--username', 'AuditLeader')
        }
        auditGuest { RunModel run ->
            run.client()
            run.sourceSet.set(performanceAuditSources)
            run.loadedMods.set(auditMods)
            run.gameDirectory = project.file('runs/audit-guest')
            run.systemProperty 'modernmusic.auditRole', 'guest'
            run.systemProperty 'modernmusic.auditSharedAccount', gradleProviders.gradleProperty('auditSharedAccount').getOrElse('false')
            run.programArguments.addAll('--username', 'AuditGuest')
        }
        client { RunModel run ->
            run.client()
            run.loadedMods.set(mainMods)
            run.gameDirectory = project.file('runs/client')
        }
        server { RunModel run ->
            run.server()
            run.loadedMods.set(mainMods)
            run.gameDirectory = project.file('runs/server')
            run.programArgument '--nogui'
        }
        clientSmoke { RunModel run ->
            run.client()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
            run.gameDirectory = project.file('runs/client-smoke')
        }
        lifecycleSmoke { RunModel run ->
            run.client()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
            run.gameDirectory = project.file('runs/lifecycle-smoke')
            run.systemProperty 'modernmusic.lifecycleSmoke', 'true'
        }
        fontSmoke { RunModel run ->
            run.client()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
            run.gameDirectory = project.file('runs/font-smoke')
            run.systemProperty 'modernmusic.fontSmoke', 'true'
        }
        uiGallery { RunModel run ->
            run.client()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
            run.gameDirectory = project.file('runs/ui-gallery')
            run.systemProperty 'modernmusic.uiGallery', 'true'
        }
        searchSmoke { RunModel run ->
            run.client()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
            run.gameDirectory = project.file('runs/search-smoke')
            run.systemProperty 'modernmusic.searchSmoke', 'true'
        }
        roomHostSmoke { RunModel run ->
            run.client()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
            run.gameDirectory = project.file('runs/room-host-smoke')
            run.systemProperty 'modernmusic.roomSmoke', 'host'
            run.systemProperty 'modernmusic.audioSmoke', gradleProviders.gradleProperty('audioSmoke').getOrElse('false')
            run.systemProperty 'modernmusic.sharedSmoke', gradleProviders.gradleProperty('sharedSmoke').getOrElse('false')
            run.systemProperty 'modernmusic.ftbSmoke', gradleProviders.gradleProperty('ftbSmoke').getOrElse('false')
            run.systemProperty 'modernmusic.roomUiSmoke', gradleProviders.gradleProperty('roomUiSmoke').getOrElse('false')
            run.programArguments.addAll('--username', 'RoomHost')
        }
        roomGuestSmoke { RunModel run ->
            run.client()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
            run.gameDirectory = project.file('runs/room-guest-smoke')
            run.systemProperty 'modernmusic.roomSmoke', 'guest'
            run.systemProperty 'modernmusic.audioSmoke', gradleProviders.gradleProperty('audioSmoke').getOrElse('false')
            run.systemProperty 'modernmusic.sharedSmoke', gradleProviders.gradleProperty('sharedSmoke').getOrElse('false')
            run.systemProperty 'modernmusic.ftbSmoke', gradleProviders.gradleProperty('ftbSmoke').getOrElse('false')
            run.systemProperty 'modernmusic.roomUiSmoke', gradleProviders.gradleProperty('roomUiSmoke').getOrElse('false')
            run.programArguments.addAll('--username', 'RoomGuest')
        }
        roomServerSmoke { RunModel run ->
            run.server()
            run.sourceSet.set(clientSmokeSources)
            run.loadedMods.set(smokeMods)
